name: Update fuel data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fuel.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GdeBenz data
        shell: bash
        run: |
          mkdir -p data
          URL='https://www.gdebenz.ru/api/stations?lat1=56.17&lon1=43.30&lat2=56.32&lon2=43.58'
          curl --fail --location --silent --show-error --max-time 25             -A 'Mozilla/5.0 BenzRadar/1.0'             -H 'Accept: application/json'             "$URL" -o data/stations.tmp
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("data/stations.tmp")
          raw=p.read_text(encoding="utf-8")
          obj=json.loads(raw)
          pathlib.Path("data/stations.json").write_text(
              json.dumps(obj, ensure_ascii=False, separators=(",",":")),
              encoding="utf-8"
          )
          print("JSON OK; bytes:", len(raw))
          PY
          rm -f data/stations.tmp
      - name: Commit fresh data
        run: |
          git config user.name "benzradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stations.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live fuel data"
          git push

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><link rel="manifest" href="manifest.json"><title>БензРадар</title><style>body{margin:0;background:#07101d;color:#eef6ff;font:16px system-ui}main{max-width:760px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{background:#13233a;padding:8px 12px;border-radius:99px}.fuel{display:flex;gap:10px;margin:20px 0}.fuel button,.refresh{border:0;border-radius:14px;padding:14px;background:#15243a;color:#fff;font-weight:700}.fuel button{flex:1}.fuel .on{background:#31c48d;color:#06130e}.card{background:#0e1b2c;border:1px solid #1c314d;border-radius:18px;padding:16px;margin:12px 0}.small{font-size:13px;color:#93a4ba}.ok{color:#45dfa6}.warn{color:#ffc857}.bad{color:#ff6b6b}.old{color:#8494aa}h1{font-size:24px;margin:0}h2{font-size:18px;margin:3px 0}.refresh{width:100%;border:1px solid #2a4261}.err{white-space:pre-wrap}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#17283f}</style></head><body><main><div class="top"><div><h1>⛽ БензРадар</h1><div class="small">Дзержинск · АИ-92 / АИ-95</div></div><span id="online" class="badge">● запуск</span></div><div class="fuel"><button data-fuel="92">АИ-92</button><button class="on" data-fuel="95">АИ-95</button></div><div id="summary" class="card"><b>Подключаю живой источник…</b><div class="small">ГдеБЕНЗ · свежесть до 40 минут</div></div><button class="refresh" id="refresh" style="margin-bottom:12px">↻ Обновить данные</button><section id="list"></section><p class="small">Статусы ГдеБЕНЗ — пользовательские отметки, а не гарантия АЗС. БензРадар отдельно показывает возраст сигнала и не считает отметки старше 40 минут актуальными.</p></main><script>
const API='./data/stations.json';let fuel='95',all=[];const wanted=['ленинского комсомола','ленина, 123','свердлова, 66','красноармейская, 5'];function mins(x){if(x==null)return null;if(typeof x==='number')return x;let d=new Date(x);return isNaN(d)?null:Math.max(0,Math.round((Date.now()-d)/60000))}function normalize(s){
 let fuels=String(s.fuels_now??s.fuels??'').toLowerCase();
 let times=[];
 let pn=s.prices_now||{};
 for(const k of ['92','95']) if(pn[k]&&pn[k].t) times.push(pn[k].t.replace(' ','T')+'+03:00');
 let age=s.age_minutes??mins(s.last_at??s.updated_at??s.last_mark??(times.length?times.sort().at(-1):null));
 return{name:s.name??s.brand??'АЗС',address:s.address??s.addr??'',age,status:s.status??'unknown',fuels,confirm:s.confirmations??s.marks??0,confidence:s.confidence??null,raw:s}
}function has(n,f){return n.fuels.includes(f)||n.fuels.includes('аи-'+f)||n.fuels.includes('аи '+f)}function freshClass(a){return a==null?'old':a<=15?'ok':a<=30?'warn':a<=40?'warn':'old'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let ns=all.map(normalize);let priority=ns.filter(n=>wanted.some(w=>(n.address+' '+n.name).toLowerCase().includes(w)));let fresh=ns.filter(n=>has(n,fuel)&&n.age!=null&&n.age<=40).sort((a,b)=>a.age-b.age);let rest=fresh.filter(n=>!priority.includes(n));let rows=[...priority,...rest].slice(0,30);document.querySelector('#summary').innerHTML='<b>АИ-'+fuel+': '+fresh.length+' свежих сигналов в загруженной области</b><div class="small">Приоритетные АЗС показаны сверху · отметка ≤40 мин считается свежей</div>';document.querySelector('#list').innerHTML=rows.map(n=>{let yes=has(n,fuel),a=n.age,cls=freshClass(a),txt=a==null?'время неизвестно':a+' мин назад';return '<div class="card"><div class="row"><div><h2>'+esc(n.name)+'</h2><div class="small">'+esc(n.address||'Адрес не передан источником')+'</div></div><span class="pill '+cls+'">'+txt+'</span></div><div class="row" style="margin-top:12px"><b class="'+(yes&&a<=40?'ok':'old')+'">'+(yes?'АИ-'+fuel+' отмечен':'АИ-'+fuel+' не подтверждён')+'</b><span class="small">подтв.: '+n.confirm+'</span></div></div>'}).join('')||'<div class="card">Свежих карточек источник не вернул.</div>'}async function load(){let b=document.querySelector('#online');b.textContent='● обновление';try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();all=Array.isArray(j)?j:(j.stations??j.items??j.data??[]);b.textContent='● онлайн';b.className='badge ok';render()}catch(e){b.textContent='● источник недоступен';b.className='badge bad';document.querySelector('#summary').innerHTML='<b>Не удалось получить живые данные</b><div class="small err">'+esc(e.message)+' · интерфейс не подменяет их тестовыми значениями.</div>';document.querySelector('#list').innerHTML=''}}document.querySelectorAll('[data-fuel]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-fuel]').forEach(y=>y.classList.remove('on'));x.classList.add('on');fuel=x.dataset.fuel;render()});document.querySelector('#refresh').onclick=load;load();setInterval(load,300000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
